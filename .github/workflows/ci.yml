name: CI

# Проверка ядра на каждый PR и push в main — без облака (DECISIONS.md, 30.09.2026, «Как проверяется работа без облака»):
#   1) сервер: node:test на чистой PostgreSQL 16 + хранилище MinIO (S3-совместимое, как Yandex Object Storage);
#   2) контейнер: собирается тот же образ, что пойдёт в облако, запускается с базой и MinIO,
#      против него — Playwright на телефоне 412×915; скриншоты сохраняются к прогону.
# Все значения ниже — тестовые, не секреты. В облако и к боевым данным CI не ходит.
on:
  pull_request:
  push:
    branches: [main]

env:
  # Официальные образы MinIO больше не публикуются на Docker Hub; pgsty/minio — сборка того же сервера MinIO.
  MINIO_IMAGE: pgsty/minio:RELEASE.2026-08-04T00-00-00Z

jobs:
  server:
    name: Сервер · PostgreSQL 16 + MinIO
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/delo_test
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Уязвимости в зависимостях
        run: npm audit --omit=dev --audit-level=high
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin "$MINIO_IMAGE" server /data
          for i in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/ready && exit 0; sleep 1; done; docker logs minio; exit 1
      - name: Проверки сервера
        run: npm test

  container:
    name: Контейнер · телефон 412×915
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMAGE: delo:${{ github.sha }}
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/delo_ci
      UI_BASE_URL: http://127.0.0.1:8080
      UI_TEST_CONTROL_TOKEN: ci-test-control-token-0123456789
      UI_CRM_BRIDGE_SECRET: ci-crm-bridge-secret-0123456789abcdef
      UI_ALLOWED_ORIGINS: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Сборка контейнера
        run: docker build -t "$IMAGE" .
      - name: Контейнер не от root и с сертификатом базы Яндекса
        run: |
          test "$(docker run --rm "$IMAGE" id -u)" != "0"
          docker run --rm "$IMAGE" sh -c 'grep -q "BEGIN CERTIFICATE" "$DB_CA_PATH"'

      - name: MinIO и бакет
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin "$MINIO_IMAGE" server /data
          for i in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          node tests/tools/make-bucket.mjs http://127.0.0.1:9000 delo-ci-files

      - name: Миграции и запуск контейнера
        run: |
          cat > "$RUNNER_TEMP/ci.env" <<'EOF'
          APP_ENV=test
          PORT=8080
          DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/delo_ci
          DB_SSL=disable
          COOKIE_SECURE=0
          APP_SECRET=ci-only-secret-0123456789abcdef0123456789
          TEST_CONTROL_TOKEN=ci-test-control-token-0123456789
          CRM_BRIDGE_SECRET=ci-crm-bridge-secret-0123456789abcdef
          CRM_URL=https://crm.example.test
          AUTH_RATE_MAX=200
          STORAGE_PROVIDER=s3
          S3_ENDPOINT=http://127.0.0.1:9000
          S3_BUCKET=delo-ci-files
          S3_ACCESS_KEY=minioadmin
          S3_SECRET_KEY=minioadmin
          S3_PATH_STYLE=1
          S3_REGION=us-east-1
          EOF
          sed -i 's/^ *//' "$RUNNER_TEMP/ci.env"
          docker run --rm --network host --env-file "$RUNNER_TEMP/ci.env" "$IMAGE" node src/migrate.mjs
          docker run -d --name delo-app --network host --env-file "$RUNNER_TEMP/ci.env" "$IMAGE"
          for i in $(seq 30); do curl -sf "$UI_BASE_URL/api/health" && exit 0; sleep 1; done; docker logs delo-app; exit 1

      - name: Браузер
        run: npx playwright install --with-deps chromium
      - name: Телефон 412×915 против контейнера
        run: npm run test:ui
      - name: Журнал контейнера
        if: failure()
        run: docker logs delo-app
      - name: Скриншоты и отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screens
          path: test-results/
          retention-days: 14

  backup:
    name: Выгрузка копий · образ + учебное восстановление
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delo_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IMAGE: delo-backup:${{ github.sha }}
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/delo_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Сборка образа выгрузки
        run: docker build -f Dockerfile.backup -t "$IMAGE" .
      - name: Не от root и с сертификатом базы Яндекса
        run: |
          test "$(docker run --rm "$IMAGE" id -u)" != "0"
          docker run --rm "$IMAGE" sh -c 'grep -q "BEGIN CERTIFICATE" "$DB_CA_PATH" && pg_dump --version | grep -q " 16\."'
      - name: База с тестовыми данными и MinIO
        run: |
          DB_SSL=disable APP_ENV=test node src/migrate.mjs
          psql "$DATABASE_URL" -qc \
            "insert into users (phone, full_name) values ('+79990009001', 'Тест Выгрузка'), ('+79990009002', 'Тест Восстановление')"
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin "$MINIO_IMAGE" server /data
          for i in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
          node tests/tools/make-bucket.mjs http://127.0.0.1:9000 delo-ci-backups
      - name: Выгрузка и восстановление во временный PostgreSQL внутри контейнера (как в облаке)
        run: |
          docker run -d --name backup --network host \
            -e PORT=8081 -e DATABASE_URL -e DB_SSL=disable \
            -e S3_ENDPOINT=http://127.0.0.1:9000 -e S3_BUCKET=delo-ci-backups -e S3_REGION=us-east-1 -e S3_PATH_STYLE=1 \
            -e S3_ACCESS_KEY=minioadmin -e S3_SECRET_KEY=minioadmin "$IMAGE"
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8081/ && break; sleep 1; done
          curl -sS --max-time 300 -X POST http://127.0.0.1:8081/run | tee "$RUNNER_TEMP/report.json"
          jq -e '.ok == true and .restore.tables and .restore.rows and .counts.users == 2 and .counts.schema_migrations > 0' "$RUNNER_TEMP/report.json"
          # 2.40: учебное восстановление последней копии, уже лежащей в хранилище (без новой выгрузки).
          curl -sS --max-time 300 -X POST http://127.0.0.1:8081/restore-latest | tee "$RUNNER_TEMP/restore.json"
          jq -e --arg key "$(jq -r .key "$RUNNER_TEMP/report.json")" '.ok == true and .key == $key and .counts.users == 2 and .migrations > 0' "$RUNNER_TEMP/restore.json"
      - name: То же от root (Serverless Containers запускают образ от root)
        run: |
          docker run -d --name backup-root --user 0 --network host \
            -e PORT=8082 -e DATABASE_URL -e DB_SSL=disable \
            -e S3_ENDPOINT=http://127.0.0.1:9000 -e S3_BUCKET=delo-ci-backups -e S3_REGION=us-east-1 -e S3_PATH_STYLE=1 \
            -e S3_ACCESS_KEY=minioadmin -e S3_SECRET_KEY=minioadmin "$IMAGE"
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8082/ && break; sleep 1; done
          curl -sS --max-time 300 -X POST http://127.0.0.1:8082/run | tee "$RUNNER_TEMP/report-root.json"
          jq -e '.ok == true and .restore.tables and .restore.rows and .counts.users == 2' "$RUNNER_TEMP/report-root.json"
          curl -sS --max-time 300 -X POST http://127.0.0.1:8082/restore-latest | tee "$RUNNER_TEMP/restore-root.json"
          jq -e '.ok == true and .counts.users == 2' "$RUNNER_TEMP/restore-root.json"
      - name: Журнал выгрузки
        if: always()
        run: docker logs backup || true; docker logs backup-root || true
