name: Runner (Yandex Cloud)

# Своя машина проверок (решение Дамира 05.10.2026, вопрос 22): бесплатные минуты и место для снимков GitHub кончились,
# все проверки, ночной прогон и выкладки идут на машине delo-ci-runner в каталоге bertel-delo-test.
# Этот workflow — единственный, что идёт на машине GitHub (несколько минут, ≈ 0,1 $): создаёт машину проверок, бакет
# снимков на 7 дней и бюджет 5 000 ₽; удаляет старые снимки проверок на GitHub. Цена — DECISIONS.md, 05.10.2026.
# Секреты: YC_SA_KEY_JSON (окружение delo-stage) и RUNNER_PAT — токен GitHub только к bertel_delo с правом
# «Administration: read and write» (нужен, чтобы получить ключ регистрации машины; кладёт Дамир).
# Действия: create — создать, если нет или не на связи; recreate — пересоздать; status — только показать;
# clean — только удалить старые снимки на GitHub.
on:
  push:
    paths: ['.github/workflows/runner.yml', 'infra/runner/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Действие'
        type: choice
        options: [create, recreate, status, clean]
        default: create

permissions:
  contents: read
  actions: write

concurrency: ci-runner

jobs:
  runner:
    runs-on: ubuntu-latest
    environment: delo-stage
    timeout-minutes: 30
    env:
      FOLDER: bertel-delo-test
      VM: delo-ci-runner
      ACTION: ${{ inputs.action || 'create' }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RUNNER_PAT: ${{ secrets.RUNNER_PAT }}
    steps:
      - uses: actions/checkout@v5

      - name: Старые снимки проверок на GitHub — удалить (разрешено Дамиром; другие данные не трогаем)
        if: env.ACTION != 'status'
        run: |
          N=0
          for id in $(gh api "repos/$REPO/actions/artifacts?per_page=100" --paginate -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && N=$((N+1))
          done
          echo "Удалено снимков проверок на GitHub: $N" | tee -a $GITHUB_STEP_SUMMARY

      - name: Токен регистрации есть
        if: env.ACTION != 'clean'
        run: |
          [ -n "$RUNNER_PAT" ] || { echo "::error::Нет секрета RUNNER_PAT — шаги для Дамира в STATE.md, «Решить Дамиру», вопрос 22"; exit 1; }
          CODE=$(curl -sS -o "$RUNNER_TEMP/runners.json" -w '%{http_code}' -H "Authorization: Bearer $RUNNER_PAT" \
            -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runners")
          [ "$CODE" = 200 ] || { echo "::error::RUNNER_PAT не подходит ($CODE): нужен доступ к $REPO и право Administration: read and write"; exit 1; }

      - name: yc CLI
        if: env.ACTION != 'clean'
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> $GITHUB_PATH

      - name: Вход в облако
        if: env.ACTION != 'clean'
        env:
          SA_KEY: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          umask 077
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          yc config set service-account-key "$RUNNER_TEMP/sa.json"
          yc config set endpoint api.cloud.yandex.net:443
          SA_ID=$(jq -r .service_account_id "$RUNNER_TEMP/sa.json")
          FOLDER_ID=$(yc iam service-account get --id "$SA_ID" --format json | jq -r .folder_id)
          NAME=$(yc resource-manager folder get --id "$FOLDER_ID" --format json | jq -r .name)
          [ "$NAME" = "$FOLDER" ] || { echo "::error::Ключ не от каталога $FOLDER"; exit 1; }
          CLOUD_ID=$(yc resource-manager folder get --id "$FOLDER_ID" --format json | jq -r .cloud_id)
          yc config set folder-id "$FOLDER_ID"
          SUFFIX=$(echo -n "$FOLDER_ID" | sha256sum | cut -c1-6)
          { echo "SA_ID=$SA_ID"; echo "FOLDER_ID=$FOLDER_ID"; echo "CLOUD_ID=$CLOUD_ID"; echo "BUCKET=delo-ci-screens-$SUFFIX"; } >> $GITHUB_ENV

      - name: Что сейчас
        if: env.ACTION != 'clean'
        run: |
          VM_STATUS=$(yc compute instance get --name "$VM" --format json 2>/dev/null | jq -r '.status // empty' || true)
          RUNNER=$(jq -c --arg n "$VM" '[.runners[] | select(.name == $n)][0] // {}' "$RUNNER_TEMP/runners.json")
          RUNNER_STATUS=$(echo "$RUNNER" | jq -r '.status // "нет"')
          echo "Машина: ${VM_STATUS:-нет}; на связи с GitHub: $RUNNER_STATUS" | tee -a $GITHUB_STEP_SUMMARY
          NEED=0
          case "$ACTION" in
            recreate) NEED=1 ;;
            create) [ "$VM_STATUS" = RUNNING ] && [ "$RUNNER_STATUS" = online ] || NEED=1 ;;
          esac
          { echo "VM_STATUS=$VM_STATUS"; echo "RUNNER_ID=$(echo "$RUNNER" | jq -r '.id // empty')"; echo "NEED=$NEED"; } >> $GITHUB_ENV

      - uses: actions/setup-node@v5
        if: env.NEED == '1'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.NEED == '1'

      - name: Бакет снимков (7 дней) и ключ только к нему
        if: env.NEED == '1'
        run: |
          W_ID=$(yc iam service-account get --name delo-ci-screens --format json 2>/dev/null | jq -r '.id // empty' || true)
          [ -n "$W_ID" ] || W_ID=$(yc iam service-account create --name delo-ci-screens \
            --description "Снимки проверок: запись только в бакет $BUCKET" --format json | jq -r .id)
          # Временный ключ технического пользователя — только чтобы завести бакет; удаляется сразу.
          yc iam access-key create --service-account-id "$SA_ID" --description "ci-screens setup (временный)" --format json > "$RUNNER_TEMP/tmp-key.json"
          TMP_ID=$(jq -r .access_key.id "$RUNNER_TEMP/tmp-key.json")
          export S3_ACCESS_KEY=$(jq -r .access_key.key_id "$RUNNER_TEMP/tmp-key.json") S3_SECRET_KEY=$(jq -r .secret "$RUNNER_TEMP/tmp-key.json")
          echo "::add-mask::$S3_SECRET_KEY"
          sleep 5
          node tests/tools/ci-screens.mjs setup "$BUCKET" "$W_ID" || { yc iam access-key delete --id "$TMP_ID"; exit 1; }
          yc iam access-key delete --id "$TMP_ID"
          rm -f "$RUNNER_TEMP/tmp-key.json"
          # Ключ машины: прежние удаляем, новый — только в настройку машины.
          for k in $(yc iam access-key list --service-account-id "$W_ID" --format json | jq -r '.[].id'); do yc iam access-key delete --id "$k"; done
          yc iam access-key create --service-account-id "$W_ID" --description "машина проверок $VM" --format json > "$RUNNER_TEMP/w-key.json"
          echo "::add-mask::$(jq -r .secret "$RUNNER_TEMP/w-key.json")"

      - name: Машина проверок
        if: env.NEED == '1'
        run: |
          if [ -n "$VM_STATUS" ]; then yc compute instance delete --name "$VM"; fi
          if [ -n "$RUNNER_ID" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $RUNNER_PAT" "https://api.github.com/repos/$REPO/actions/runners/$RUNNER_ID" || true
          fi
          REG=$(curl -fsS -X POST -H "Authorization: Bearer $RUNNER_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runners/registration-token" | jq -r .token)
          echo "::add-mask::$REG"
          umask 077
          REG="$REG" REPO_URL="https://github.com/$REPO" python3 - "$RUNNER_TEMP/w-key.json" "$RUNNER_TEMP/user-data.yaml" <<'PY'
          import json, os, sys
          key = json.load(open(sys.argv[1]))
          s = open('infra/runner/cloud-init.yaml').read()
          for k, v in {'__REG_TOKEN__': os.environ['REG'], '__REPO_URL__': os.environ['REPO_URL'], '__S3_BUCKET__': os.environ['BUCKET'],
                       '__S3_ACCESS_KEY__': key['access_key']['key_id'], '__S3_SECRET_KEY__': key['secret']}.items():
              s = s.replace(k, v)
          open(sys.argv[2], 'w').write(s)
          PY
          rm -f "$RUNNER_TEMP/w-key.json"
          ZONE=$(yc vpc subnet get --name delo-stage-a --format json | jq -r .zone_id)
          # 2 vCPU (100%), 4 ГБ + 4 ГБ подкачки, диск SSD 30 ГБ, Ubuntu 24.04; не прерываемая — работает всегда.
          yc compute instance create --name "$VM" --zone "$ZONE" \
            --description "Проверки GitHub для bertel_delo (только тестовые данные)" \
            --labels purpose=ci,env=stage \
            --platform standard-v3 --cores 2 --core-fraction 100 --memory 4GB \
            --create-boot-disk image-folder-id=standard-images,image-family=ubuntu-2404-lts,type=network-ssd,size=30 \
            --network-interface subnet-name=delo-stage-a,nat-ip-version=ipv4 \
            --metadata-from-file user-data="$RUNNER_TEMP/user-data.yaml" >/dev/null
          rm -f "$RUNNER_TEMP/user-data.yaml"
          echo "Машина $VM создана, ждём, пока она выйдет на связь с GitHub" | tee -a $GITHUB_STEP_SUMMARY

      - name: Машина на связи
        if: env.NEED == '1'
        timeout-minutes: 15
        run: |
          for i in $(seq 1 56); do
            S=$(curl -sS -H "Authorization: Bearer $RUNNER_PAT" "https://api.github.com/repos/$REPO/actions/runners" \
              | jq -r --arg n "$VM" '[.runners[] | select(.name == $n)][0].status // "нет"')
            echo "попытка $i: $S"
            if [ "$S" = online ]; then
              # Ключ регистрации и ключ к бакету больше не нужны в настройках машины (на диске машины ключ к бакету остаётся).
              yc compute instance remove-metadata --name "$VM" --keys user-data >/dev/null || true
              echo "### Машина проверок на связи — все проверки идут на ней" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            sleep 15
          done
          echo "::error::Машина не вышла на связь за 14 минут"; exit 1

      - name: Бюджет 5 000 ₽ в месяц (Compute Cloud и Object Storage каталога)
        if: env.ACTION == 'create' || env.ACTION == 'recreate'
        continue-on-error: true
        run: |
          T=$(yc iam create-token); echo "::add-mask::$T"
          API=https://billing.api.cloud.yandex.net/billing/v1
          BA=$(curl -sS -H "Authorization: Bearer $T" "$API/billingAccounts" | jq -r '.billingAccounts[0].id // empty')
          [ -n "$BA" ] || { echo "::warning::Нет доступа к платёжному аккаунту — бюджет ставит Дамир (STATE.md, вопрос 22)"; echo "Бюджет: нет доступа — шаги для Дамира в STATE.md" >> $GITHUB_STEP_SUMMARY; exit 1; }
          if curl -sS -H "Authorization: Bearer $T" "$API/budgets?billingAccountId=$BA" | jq -e '.budgets[]? | select(.name == "delo-ci-5000")' >/dev/null; then
            echo "Бюджет delo-ci-5000 уже есть" >> $GITHUB_STEP_SUMMARY; exit 0
          fi
          SERVICES=$(curl -sS -H "Authorization: Bearer $T" "$API/services?pageSize=1000" \
            | jq -c '[.services[]? | select(.name | test("Compute Cloud|Object Storage")) | .id]')
          BODY=$(jq -nc --arg ba "$BA" --arg cloud "$CLOUD_ID" --arg folder "$FOLDER_ID" --argjson svc "$SERVICES" '{
            billingAccountId: $ba, name: "delo-ci-5000",
            costBudget: { amount: "5000", resetPeriod: "MONTHLY",
              thresholdRules: [{type: "PERCENTAGE", amount: "50"}, {type: "PERCENTAGE", amount: "80"}, {type: "PERCENTAGE", amount: "100"}],
              filter: { serviceIds: $svc, cloudFoldersFilters: [{cloudId: $cloud, folderIds: [$folder]}] } } }')
          CODE=$(curl -sS -o "$RUNNER_TEMP/budget.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $T" -H 'Content-Type: application/json' -d "$BODY" "$API/budgets")
          cat "$RUNNER_TEMP/budget.json"; echo
          [ "$CODE" = 200 ] || { echo "::warning::Бюджет не поставлен ($CODE) — шаги для Дамира в STATE.md"; echo "Бюджет: не поставлен ($CODE)" >> $GITHUB_STEP_SUMMARY; exit 1; }
          echo "Бюджет delo-ci-5000: 5 000 ₽ в месяц, уведомления на 50, 80 и 100%" >> $GITHUB_STEP_SUMMARY

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/tmp-key.json" "$RUNNER_TEMP/w-key.json" "$RUNNER_TEMP/user-data.yaml"
